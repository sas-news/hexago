<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>hexago photo pipeline test</title>
<style>
  body { font-family: system-ui, sans-serif; background: #111; color: #ddd; margin: 0; padding: 16px; }
  pre { white-space: pre-wrap; font-size: 12px; }
  canvas { max-width: 100%; }
</style>
</head>
<body>
<pre id="log">photo pipeline test page</pre>
<div id="viz"></div>

<script src="/js/photo/geom.js"></script>
<script src="/js/photo/features.js"></script>
<script src="/js/photo/model.js"></script>
<script src="/js/photo/rectify.js"></script>
<script src="/js/photo/detect.js"></script>
<script src="/js/photo/recognize.js"></script>
<script src="/js/photo/store.js"></script>
<script>
/*
 * window.__photoTest.run(name) -> JSON
 * ケース:
 *   real       実写真の読み取り精度（自動検出 / 正解外枠・両慣習）
 *   detect     外枠自動検出の誤差
 *   synthetic  合成canonical画像（dev/photo/testdata/synth/manifest.json があれば）
 *   store      局面ライブラリのCRUD
 *   all        上記をまとめて
 */
(function () {
  'use strict';
  var BASE = '/';
  var R = window.HexagoPhotoRecognize;
  var Geom = window.HexagoPhotoGeom;
  var Det = window.HexagoPhotoDetect;
  var Store = window.HexagoPhotoStore;
  var CLASS_NAME = ['empty', 'black', 'white', 'red', 'blue', 'green', 'yellow', 'purple'];
  var GT_CLS = { '.': 0, 'K': 1, 'W': 2, 'B': 4 };

  var MODEL_LOAD = null;
  function ensureModel() {
    if (MODEL_LOAD) return MODEL_LOAD;
    if (!window.HexagoPhotoModel) return Promise.resolve(false);
    MODEL_LOAD = fetch(BASE + 'js/photo/model.json', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (json) {
        if (!json || json.trained !== true) return false;
        return window.HexagoPhotoModel.fromJSON(json).then(function () { return true; });
      })
      .catch(function () { return false; });
    return MODEL_LOAD;
  }

  function log(msg) {
    var el = document.getElementById('log');
    el.textContent += '\n' + msg;
  }

  function loadImageData(url) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      img.onload = function () {
        var cv = document.createElement('canvas');
        cv.width = img.width; cv.height = img.height;
        var ctx = cv.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(img, 0, 0);
        resolve({ imageData: ctx.getImageData(0, 0, img.width, img.height), img: img });
      };
      img.onerror = function () { reject(new Error('image load failed: ' + url)); };
      img.src = url;
    });
  }

  function accuracy(result, gtLabels) {
    var hit = 0, miss = [];
    for (var i = 0; i < gtLabels.length; i++) {
      var want = GT_CLS[gtLabels[i]];
      var got = result.points[i].cls;
      if (want === got) hit++;
      else miss.push({ i: i, want: CLASS_NAME[want], got: CLASS_NAME[got], conf: +result.points[i].conf.toFixed(3) });
    }
    return { acc: hit / gtLabels.length, hit: hit, total: gtLabels.length, misses: miss.slice(0, 12), missCount: miss.length };
  }

  function longEdgeScale(w, h, max) {
    var s = Math.min(1, max / Math.max(w, h));
    return [Math.round(w * s), Math.round(h * s)];
  }

  function loadAsPhoto(url, maxSide) {
    return loadImageData(url).then(function (r) {
      var dim = longEdgeScale(r.imageData.width, r.imageData.height, maxSide || 1600);
      if (dim[0] === r.imageData.width && dim[1] === r.imageData.height) return r;
      var cv = document.createElement('canvas');
      cv.width = dim[0]; cv.height = dim[1];
      var ctx = cv.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(r.img, 0, 0, dim[0], dim[1]);
      return { imageData: ctx.getImageData(0, 0, dim[0], dim[1]), img: r.img };
    });
  }

  async function caseWeights() {
    await ensureModel();
    var photo = await loadAsPhoto(BASE + 'dev/photo/testdata/IMG_0252.jpg', 1600);
    var gt = await (await fetch(BASE + 'dev/photo/testdata/IMG_0252.gt.json')).json();
    var out = {};
    for (var w = 0; w <= 1.0001; w += 0.125) {
      window.__hexagoPhotoModelWeight = w;
      var r = R.analyze({ imageData: photo.imageData, borderCorners: gt.paper_corners_px, size: 13, convention: 'honeycomb' });
      var hit = 0;
      for (var i = 0; i < gt.labels.length; i++) if (r.points[i].cls === GT_CLS[gt.labels[i]]) hit++;
      out['w' + w.toFixed(3)] = +(hit / gt.labels.length).toFixed(4);
    }
    window.__hexagoPhotoModelWeight = undefined;
    return out;
  }

  async function caseStrategies() {
    await ensureModel();
    var out = { real: {}, synthetic: {} };
    var photo = await loadAsPhoto(BASE + 'dev/photo/testdata/IMG_0252.jpg', 1600);
    var gt = await (await fetch(BASE + 'dev/photo/testdata/IMG_0252.gt.json')).json();
    var manifest = null;
    try { manifest = await (await fetch(BASE + 'dev/photo/testdata/synth/manifest.json', { cache: 'no-store' })).json(); } catch (e) { }
    var strides = ['heuristic', 'model', 'ensemble', 'cascade'];
    for (var si = 0; si < strides.length; si++) {
      window.__hexagoPhotoStrategy = strides[si];
      var r = R.analyze({ imageData: photo.imageData, borderCorners: gt.paper_corners_px, size: 13, convention: 'honeycomb' });
      var hit = 0;
      for (var i = 0; i < gt.labels.length; i++) if (r.points[i].cls === GT_CLS[gt.labels[i]]) hit++;
      out.real[strides[si]] = +(hit / gt.labels.length).toFixed(4);
      // 合成 canonical のみ
      var sh = 0, st = 0;
      if (manifest) {
        var items = (manifest.images || []).filter(function (it) { return (it.kind || 'canonical') === 'canonical'; });
        for (var k = 0; k < items.length; k++) {
          var it = items[k];
          var p2;
          try { p2 = await loadImageData(BASE + 'dev/photo/testdata/synth/' + it.file); } catch (e) { continue; }
          var NM = { empty: 0, black: 1, white: 2, red: 3, blue: 4, green: 5, yellow: 6, purple: 7 };
          var L0 = Geom.layout(it.size);
          var sc = p2.imageData.width / 1024;
          var corners = L0.corners.map(function (q) { return [q[0] * sc, q[1] * sc]; });
          var rr = R.analyze({ imageData: p2.imageData, borderCorners: corners, size: it.size, convention: 'triangular' });
          for (var j = 0; j < it.labels.length; j++) {
            st++;
            if (rr.points[j].cls === NM[it.labels[j]]) sh++;
          }
        }
      }
      out.synthetic[strides[si]] = st ? +(sh / st).toFixed(4) : null;
    }
    // cascade のしきい値チューニング
    window.__hexagoPhotoStrategy = 'cascade';
    out.cascadeTuning = {};
    var variants = [
      { name: 'm14_w25', minConf: 0.50, minMargin: 0.14, w: 0.25 },
      { name: 'm14_w125', minConf: 0.50, minMargin: 0.14, w: 0.125 },
      { name: 'm18_w25', minConf: 0.50, minMargin: 0.18, w: 0.25 },
      { name: 'm05_w25', minConf: 0.45, minMargin: 0.05, w: 0.25 },
      { name: 'm00_w00', minConf: 0.50, minMargin: 0.00, w: 0.0 }
    ];
    for (var vi = 0; vi < variants.length; vi++) {
      window.__hexagoPhotoCascade = variants[vi];
      var rv = R.analyze({ imageData: photo.imageData, borderCorners: gt.paper_corners_px, size: 13, convention: 'honeycomb' });
      var hv = 0;
      for (var q2 = 0; q2 < gt.labels.length; q2++) if (rv.points[q2].cls === GT_CLS[gt.labels[q2]]) hv++;
      var sv = 0, tv = 0;
      if (manifest) {
        var its = (manifest.images || []).filter(function (it) { return (it.kind || 'canonical') === 'canonical'; });
        for (var kk = 0; kk < its.length; kk++) {
          var it2 = its[kk];
          var pp;
          try { pp = await loadImageData(BASE + 'dev/photo/testdata/synth/' + it2.file); } catch (e) { continue; }
          var NM2 = { empty: 0, black: 1, white: 2, red: 3, blue: 4, green: 5, yellow: 6, purple: 7 };
          var LL = Geom.layout(it2.size);
          var ss = pp.imageData.width / 1024;
          var cc = LL.corners.map(function (q3) { return [q3[0] * ss, q3[1] * ss]; });
          var r3 = R.analyze({ imageData: pp.imageData, borderCorners: cc, size: it2.size, convention: 'triangular' });
          for (var jj = 0; jj < it2.labels.length; jj++) { tv++; if (r3.points[jj].cls === NM2[it2.labels[jj]]) sv++; }
        }
      }
      out.cascadeTuning[variants[vi].name] = { real: +(hv / gt.labels.length).toFixed(4), syn: tv ? +(sv / tv).toFixed(4) : null };
    }
    delete window.__hexagoPhotoCascade;
    delete window.__hexagoPhotoStrategy;
    return out;
  }

  async function caseAutoFit() {
    await ensureModel();
    var photo = await loadAsPhoto(BASE + 'dev/photo/testdata/IMG_0252.jpg', 1600);
    var gt = await (await fetch(BASE + 'dev/photo/testdata/IMG_0252.gt.json')).json();
    var det = Det.detect(photo.imageData);
    var t0 = performance.now();
    var fit = R.autoFit(photo.imageData, det.corners, {});
    var ms = performance.now() - t0;
    var r = R.analyze({ imageData: photo.imageData, borderCorners: det.corners, size: fit.size, margin: fit.margin });
    var hit = 0, miss = [];
    for (var i = 0; i < gt.labels.length; i++) {
      if (r.points[i].cls === GT_CLS[gt.labels[i]]) hit++;
      else miss.push({ i: i, want: gt.labels[i], got: CLASS_NAME[r.points[i].cls] });
    }
    return { fit: fit, ms: +ms.toFixed(1), acc: hit / gt.labels.length, miss: miss };
  }

  async function caseMarginAcc() {
    await ensureModel();
    var photo = await loadAsPhoto(BASE + 'dev/photo/testdata/IMG_0252.jpg', 1600);
    var gt = await (await fetch(BASE + 'dev/photo/testdata/IMG_0252.gt.json')).json();
    var det = Det.detect(photo.imageData);
    var out = {};
    [0, 0.15, 0.3, 0.45, 0.577, 0.7, 0.85, 1.0].forEach(function (m) {
      try {
        var r = R.analyze({ imageData: photo.imageData, borderCorners: det.corners, size: 13, margin: m });
        var hit = 0;
        for (var i = 0; i < gt.labels.length; i++) if (r.points[i].cls === GT_CLS[gt.labels[i]]) hit++;
        out[m] = { acc: +(hit / gt.labels.length).toFixed(4), score: +r.score.toFixed(4) };
      } catch (e) { out[m] = null; }
    });
    return out;
  }

  async function caseFit() {
    // サイズ・余白の候補ごとに「幾何の一致度」を測る（分類の平均信頼度をスコアにする）
    await ensureModel();
    var photo = await loadAsPhoto(BASE + 'dev/photo/testdata/IMG_0252.jpg', 1600);
    var gt = await (await fetch(BASE + 'dev/photo/testdata/IMG_0252.gt.json')).json();
    var det = Det.detect(photo.imageData);
    var out = { sizeScores: {}, marginScores: {}, best: null };
    [9, 13, 19, 25].forEach(function (sz) {
      try {
        var r = R.analyze({ imageData: photo.imageData, borderCorners: det.corners, size: sz, convention: 'honeycomb' });
        out.sizeScores[sz] = +r.score.toFixed(4);
      } catch (e) { out.sizeScores[sz] = null; }
    });
    [0, 0.2, 0.4, 0.577, 0.8, 1.0].forEach(function (m) {
      try {
        var r2 = R.analyze({ imageData: photo.imageData, borderCorners: det.corners, size: 13, margin: m });
        out.marginScores[m] = +r2.score.toFixed(4);
      } catch (e) { out.marginScores[m] = null; }
    });
    return out;
  }

  async function caseReal() {
    var modelLoaded = await ensureModel();
    var t0 = performance.now();
    var photo = await loadAsPhoto(BASE + 'dev/photo/testdata/IMG_0252.jpg', 1600);
    var imageData = photo.imageData;
    var gt = await (await fetch(BASE + 'dev/photo/testdata/IMG_0252.gt.json')).json();
    var det = Det.detect(imageData);
    var tDet = performance.now();
    var out = {
      image: { w: imageData.width, h: imageData.height },
      detect: { conf: det.confidence, corners: det.corners, ms: +(tDet - t0).toFixed(1) },
      cases: {}
    };
    var t1 = performance.now();
    var byGt = R.analyze({
      imageData: imageData, borderCorners: gt.paper_corners_px, size: gt.size, convention: 'honeycomb'
    });
    out.cases.gtCornersHoneycomb = Object.assign(accuracy(byGt, gt.labels), {
      ms: +(performance.now() - t1).toFixed(1),
      score: +byGt.score.toFixed(4),
      classSource: byGt.classSource,
      refine: byGt.refine
    });
    var t2 = performance.now();
    var byDet = R.analyze({
      imageData: imageData, borderCorners: det.corners, size: gt.size, convention: 'honeycomb'
    });
    out.cases.autoHoneycomb = Object.assign(accuracy(byDet, gt.labels), {
      ms: +(performance.now() - t2).toFixed(1),
      score: +byDet.score.toFixed(4),
      refine: byDet.refine
    });
    var t3 = performance.now();
    var byTri = R.analyze({
      imageData: imageData, borderCorners: det.corners, size: gt.size, convention: 'triangular'
    });
    out.cases.autoTriangular = Object.assign(accuracy(byTri, gt.labels), {
      ms: +(performance.now() - t3).toFixed(1),
      score: +byTri.score.toFixed(4)
    });
    // 代表的な可視化（認識結果をcanonical上に描く）
    var viz = document.getElementById('viz');
    viz.innerHTML = '';
    var cv = document.createElement('canvas');
    cv.width = 420; cv.height = 420;
    var ctx = cv.getContext('2d');
    var L = byDet.layout;
    var id = ctx.createImageData(L.W, L.W);
    for (var i = 0, j = 0; i < L.W * L.W; i++, j += 4) {
      id.data[j] = byDet.canon[i * 3];
      id.data[j + 1] = byDet.canon[i * 3 + 1];
      id.data[j + 2] = byDet.canon[i * 3 + 2];
      id.data[j + 3] = 255;
    }
    var tmp = document.createElement('canvas');
    tmp.width = L.W; tmp.height = L.W;
    tmp.getContext('2d').putImageData(id, 0, 0);
    ctx.drawImage(tmp, 0, 0, 420, 420);
    var sc = 420 / L.W;
    byDet.points.forEach(function (p) {
      ctx.beginPath();
      ctx.arc(p.x * sc, p.y * sc, L.cell * 0.42 * sc, 0, 7);
      ctx.strokeStyle = p.cls ? R.CLASS_COLORS[p.cls] : 'rgba(255,255,255,0.35)';
      ctx.lineWidth = 2;
      ctx.stroke();
    });
    viz.appendChild(cv);
    out.modelLoaded = modelLoaded;
    out.totalMs = +(performance.now() - t0).toFixed(1);
    return out;
  }

  async function caseDetect() {
    var photo = await loadAsPhoto(BASE + 'dev/photo/testdata/IMG_0252.jpg', 1600);
    var gt = await (await fetch(BASE + 'dev/photo/testdata/IMG_0252.gt.json')).json();
    var t0 = performance.now();
    var det = Det.detect(photo.imageData);
    var ms = performance.now() - t0;
    function cornerError(a, b) {
      var best = null;
      for (var sh = 0; sh < 6; sh++) {
        var sum = 0;
        for (var i = 0; i < 6; i++) {
          var p = a[(i + sh) % 6], q = b[i];
          sum += Math.hypot(p[0] - q[0], p[1] - q[1]);
        }
        sum /= 6;
        if (!best || sum < best.mean) best = { mean: sum, shift: sh };
      }
      return best;
    }
    return {
      conf: det.confidence,
      hexAreaRatio: det.hexAreaRatio,
      ms: +ms.toFixed(1),
      corners: det.corners,
      errorVsGt: det.corners ? cornerError(det.corners, gt.paper_corners_px) : null
    };
  }

  async function caseAlign() {
    await ensureModel();
    // 認識した石の位置が、canonical 画像の実際の石の重心からどれだけずれているかを測る
    var photo = await loadAsPhoto(BASE + 'dev/photo/testdata/IMG_0252.jpg', 1600);
    var det = Det.detect(photo.imageData);
    var r = R.analyze({ imageData: photo.imageData, borderCorners: det.corners, size: 13, convention: 'honeycomb' });
    var W = r.layout.W, cell = r.layout.cell;
    var canon = r.canon;
    var baseL = 0.299 * r.baseline[0] + 0.587 * r.baseline[1] + 0.114 * r.baseline[2];
    var offsets = [];
    for (var k = 0; k < r.points.length; k++) {
      var p = r.points[k];
      if (!p.cls) continue;
      var rad = Math.round(cell * 0.45);
      var sumx = 0, sumy = 0, sumw = 0;
      for (var y = -rad; y <= rad; y++) {
        for (var x = -rad; x <= rad; x++) {
          var px = Math.round(p.x + x), py = Math.round(p.y + y);
          if (px < 0 || py < 0 || px >= W || py >= W) continue;
          var o = (py * W + px) * 3;
          var lum = 0.299 * canon[o] + 0.587 * canon[o + 1] + 0.114 * canon[o + 2];
          var wgt = Math.abs(lum - baseL) / 255;
          sumx += x * wgt; sumy += y * wgt; sumw += wgt;
        }
      }
      if (sumw > 0.01) offsets.push({ i: k, dx: sumx / sumw, dy: sumy / sumw });
    }
    var meanDx = 0, meanDy = 0, meanAbs = 0;
    offsets.forEach(function (o) { meanDx += o.dx; meanDy += o.dy; meanAbs += Math.hypot(o.dx, o.dy); });
    var n = offsets.length || 1;
    return {
      n: offsets.length,
      cell: +cell.toFixed(2),
      meanDxPx: +(meanDx / n).toFixed(2),
      meanDyPx: +(meanDy / n).toFixed(2),
      meanAbsPx: +(meanAbs / n).toFixed(2),
      meanAbsFracCell: +(meanAbs / n / cell).toFixed(3),
      refine: r.refine,
      worst: offsets.slice().sort(function (a, b) { return Math.hypot(b.dx, b.dy) - Math.hypot(a.dx, a.dy); }).slice(0, 5)
    };
  }

  async function caseStore() {
    var before = Store.list().length;
    var e = {
      name: 'unit-test',
      size: 9,
      playerCount: 2,
      board: new Array(61).fill(0),
      labels: new Array(61).fill(0),
      colors: { 1: { fill: '#111111', stroke: '#333333' }, 2: { fill: '#ffffff', stroke: '#333333' } },
      names: { 1: '黒', 2: '白' },
      turn: 1,
      meta: { convention: 'honeycomb', confidence: 1 },
      thumb: null
    };
    e.board[0] = 1;
    var saved = Store.save(e);
    var list = Store.list();
    var got = Store.get(saved.id);
    var json = Store.exportAll();
    var n = Store.importJSON(json);
    Store.remove(saved.id);
    return {
      ok: !!got && list.length === before + 1 && n >= 0,
      before: before,
      after: Store.list().length,
      savedId: saved.id,
      exportedBytes: json.length,
      imported: n
    };
  }

  async function caseSynthetic() {
    await ensureModel();
    // 合成テストセット: canonical（正面から見た盤）と photo（透視変換した写真風）
    var manifest;
    try {
      var res = await fetch(BASE + 'dev/photo/testdata/synth/manifest.json', { cache: 'no-store' });
      if (!res.ok) return { skipped: true, reason: 'manifest not found' };
      manifest = await res.json();
    } catch (e) { return { skipped: true, reason: e.message }; }
    var NAME2CLS = { empty: 0, black: 1, white: 2, red: 3, blue: 4, green: 5, yellow: 6, purple: 7 };
    var items = manifest.images || [];
    var out = {
      count: 0, hit: 0, total: 0, byKind: {},
      perImage: [], misses: []
    };
    function bucket(kind) {
      if (!out.byKind[kind]) out.byKind[kind] = { count: 0, hit: 0, total: 0 };
      return out.byKind[kind];
    }
    for (var k = 0; k < items.length; k++) {
      var it = items[k];
      var base = it.file;
      var ext = base.match(/\.[a-z]+$/i) ? '' : '.jpg';
      var meta = it;
      try {
        var mr = await fetch(BASE + 'dev/photo/testdata/synth/' + base.replace(/\.[a-z]+$/i, '') + '.json', { cache: 'no-store' });
        if (mr.ok) meta = Object.assign({}, it, await mr.json());
      } catch (e) { /* manifest の情報だけで進む */ }
      var photo;
      try { photo = await loadImageData(BASE + 'dev/photo/testdata/synth/' + base + ext); } catch (e) { continue; }
      var size = meta.size || it.size;
      var labels = meta.labels || it.labels;
      if (!size || !labels) continue;
      var kind = meta.kind || it.kind || 'canonical';
      var results = [];
      if (kind === 'canonical' || !meta.corners_px) {
        // 正面画像: レイアウト既定の格子6隅（自動検出は使わない）
        var sc = photo.imageData.width / 1024;
        var L0 = Geom.layout(size);
        var corners = L0.corners.map(function (q) { return [q[0] * sc, q[1] * sc]; });
        results.push({ conv: 'triangular', r: R.analyze({ imageData: photo.imageData, borderCorners: corners, size: size, convention: 'triangular' }) });
      } else {
        var det = Det.detect(photo.imageData);
        if (!det.corners) { out.misses.push({ file: base, reason: 'detect failed' }); continue; }
        ['honeycomb', 'triangular'].forEach(function (conv) {
          try {
            results.push({ conv: conv, r: R.analyze({ imageData: photo.imageData, borderCorners: det.corners, size: size, convention: conv }) });
          } catch (e) { /* skip */ }
        });
        // 検出した外枠と正解外枠の誤差（デバッグ用）
        if (meta.paper_corners_px) {
          var gtc = meta.paper_corners_px;
          var bestErr = null;
          for (var sh = 0; sh < 6; sh++) {
            var sum = 0;
            for (var q2 = 0; q2 < 6; q2++) {
              var a = det.corners[(q2 + sh) % 6], b2 = gtc[q2];
              sum += Math.hypot(a[0] - b2[0], a[1] - b2[1]);
            }
            sum /= 6;
            if (!bestErr || sum < bestErr.mean) bestErr = { mean: +sum.toFixed(2), shift: sh };
          }
        }
      }
      var best = null;
      results.forEach(function (item) {
        var hit = 0, miss = [];
        for (var i = 0; i < labels.length; i++) {
          if (item.r.points[i].cls === NAME2CLS[labels[i]]) hit++;
          else miss.push({ i: i, want: labels[i], got: CLASS_NAME[item.r.points[i].cls], conf: +item.r.points[i].conf.toFixed(2) });
        }
        var cand = { conv: item.conv, hit: hit, n: labels.length, miss: miss, score: item.r.score };
        if (!best || cand.hit > best.hit) best = cand;
      });
      if (!best) continue;
      out.count++;
      out.hit += best.hit;
      out.total += best.n;
      bucket(kind).count++;
      bucket(kind).hit += best.hit;
      bucket(kind).total += best.n;
      out.perImage.push({ file: base, kind: kind, size: size, conv: best.conv, acc: +(best.hit / best.n).toFixed(3), miss: best.miss.length });
      out.perImage[out.perImage.length - 1].detectConf = det ? +det.confidence.toFixed(2) : null;
      out.perImage[out.perImage.length - 1].cornerErr = bestErr;
      if (best.miss.length) out.misses.push({ file: base, kind: kind, style: (meta.scenario || {}).style, miss: best.miss.slice(0, 6) });
    }
    out.acc = out.total ? out.hit / out.total : 0;
    Object.keys(out.byKind).forEach(function (kk) {
      var b = out.byKind[kk];
      b.acc = b.total ? +(b.hit / b.total).toFixed(4) : 0;
    });
    return out;
  }

  window.__photoTest = {
    run: async function (name) {
      var cases = String(name || 'all').split(',');
      var out = {};
      try {
        for (var i = 0; i < cases.length; i++) {
          var c = cases[i].trim();
          if (c === 'real' || c === 'all') out.real = await caseReal();
          else if (c === 'detect' || c === 'all') out.detect = await caseDetect();
          else if (c === 'store' || c === 'all') out.store = await caseStore();
          else if (c === 'align') out.align = await caseAlign();
          else if (c === 'weights') out.weights = await caseWeights();
          else if (c === 'strategies') out.strategies = await caseStrategies();
          else if (c === 'fit') out.fit = await caseFit();
          else if (c === 'marginAcc') out.marginAcc = await caseMarginAcc();
          else if (c === 'autofit') out.autofit = await caseAutoFit();
          else if (c === 'synthetic' || c === 'all') out.synthetic = await caseSynthetic();
          else out.unknown = c;
        }
        out.ok = true;
      } catch (e) {
        out.ok = false;
        out.error = String((e && e.stack) || e);
      }
      log(JSON.stringify({ ok: out.ok, keys: Object.keys(out) }));
      return out;
    }
  };
  log('ready');
})();
</script>
